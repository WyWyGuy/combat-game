<!--Debug error catcher-->
<script>

function formatNumber(input, digits) {
	let string = input.toString();
	while (string.length < digits) {
		string = "0" + string;
	}
	return string;
}

window.onerror = function (message, url, line, column, error) {
	let output = document.getElementById('debug');
	let code = document.documentElement.outerHTML;
	let codeLines = code.split('\n').map((line) => line.replace(/ /g, '\u00A0')).map(String);
	let lineDigits = (codeLines.length).toString().length;
	let errorMessage = document.createElement('p');
	let errorStack = error.stack || "";
	let stackTrace = errorStack.split('\n').map((line) => line.replace(/ /g, '\u00A0')).map(String);
	let stackTraceLines = stackTrace.join('<br>');
	errorMessage.innerHTML += `Error: ${message} (Line ${line}, Column ${column})<br/><br/>`;
	for (let i = -2; i <= 2; i++) {
		let codeLine = document.createElement('text');
		codeLine.textContent = formatNumber((line+i).toString(), lineDigits).toString() + ": " + codeLines[line-3+i].toString();
		errorMessage.appendChild(codeLine);
		errorMessage.appendChild(document.createElement('br'));
	}
	errorMessage.innerHTML += "<br/>Details: <br/>";
	errorMessage.innerHTML += stackTraceLines;
/*
	errorMessage.innerHTML += "<br/><br/>";
	for (let i = 0; i < codeLines.length; i++) {
		let codeLine = document.createElement('text');
		codeLine.textContent = formatNumber((i+3).toString(), lineDigits).toString() + ": " + codeLines[i].toString();
		errorMessage.appendChild(codeLine);
		errorMessage.appendChild(document.createElement('br'));
	}
*/
	output.appendChild(errorMessage);
};

function elog(thing) {
	let output = document.getElementById('debug');
	let log = document.createElement('p');
	log.textContent = "Console log: " + JSON.stringify(thing);
	output.appendChild(log);
}

</script>

function Creature(name = "undefined", level = 1, health = 1, damage = 0, defaultItems = {}) {
	this.name = name;
	this.level = level;
	this.health = health;
	this.currentHealth = health;
	this.damage = damage;
	this.items = {};
	if ([boss4].includes(name)) {
		this.status = new Proxy({"Burned": 0, "Buffed": [], "Reflecting": false, "Stunned": 0, "Immune": 0}, {
			set: (target, property, value) => {
				target[property] = value;
				if (property === "Stunned") {
					if (value > 0) {
						target["Reflecting"] = false;
					} else if (value === 0) {
						target["Reflecting"] = true;
					}
				}
			return true;
			}
		});
	} else {
		this.status = {"Burned": 0, "Buffed": [], "Reflecting": false, "Stunned": 0, "Immune": 0};
	}
	if (this.name == boss4) {
		this.status["Reflecting"] = true;
	}
	for (const item in defaultItems) {
		if (itemLibrary[item]) {
			this.items[item] = {...itemLibrary[item]};
			this.items[item].quantity = defaultItems[item];
		}
	}
}

function generateItems(enemy, modifier) {
	let copiedItems = {...enemy.items};
	enemy.items = {};
	let generatedItems = {};
	for (item in itemLibrary) {
		if (item != item2 && player.items[item]) {
			let prob = 0.5 + (modifier*0.2);
			while (true) {
				if ((enemy.name == enemy22) && (item == item3)) {
					break;
				}
				if (Math.random() <= prob) {
					if (!generatedItems[item]) {
						generatedItems[item] = {...itemLibrary[item]};
					}
					generatedItems[item].quantity = Math.min((generatedItems[item].quantity + 1), 99);
					prob /= 2;
				} else {
					break;
				}
			}
		}
	}
	for (item in itemLibrary) {
		if (((copiedItems[item]) && (copiedItems[item].quantity > 0)) || ((generatedItems[item]) && (generatedItems[item].quantity > 0))) {
			enemy.items[item] = {...itemLibrary[item]};
			enemy.items[item].quantity = Math.min((((copiedItems[item]) ? (copiedItems[item].quantity) : (0)) + ((generatedItems[item]) ? (generatedItems[item].quantity) : (0))), 99);
		}
	}
}

		if (player.name) {
			name = player.name;
		}
		if (player.level) {
			level = player.level;
		}
		if (player.exp) {
			exp = player.exp;
		}
		if (player.health) {
			health = player.health;
		}
		if (player.damage) {
			damage = player.damage;
		}
		if (player.mana) {
			mana = player.mana;
		}
		if (player.items) {
			defaultItems = {};
			for (item in player.items) {
				defaultItems[item] = player.items[item].quantity;
			}
		}
		if (player.spells) {
			defaultSpells = [];
			for (spell in player.spells) {
				defaultSpells.push(spell);
			}
		}
		if (player.achievements) {
			defaultAchievements = [];
			for (achievement in player.achievements) {
				defaultAchievements.push(achievement);
			}
		}
		if (player.unlockedEnemies) {
			unlockedEnemies = [];
			for (let i = 0; i < player.unlockedEnemies.length; i++) {
				unlockedEnemies.push(enemyNames[i]);
			}
		}
		player = new Character(name, level, exp, health, damage, mana, defaultItems, defaultSpells, defaultAchievements, unlockedEnemies);
	}
	return player;
}

function generateEnemyList(base, modifier) {
	let difficulty = base + modifier*Math.min(Math.ceil(player.level/4), 5);
	let remaining = Math.max(difficulty, 1);
	let enemyList = [];
	while (remaining > 0) {
		let randomEnemy;
		let enemyLevel = Infinity;
		while (enemyLevel > remaining) {
			randomEnemy = enemyLibrary[player.unlockedEnemies[Math.floor(Math.random() * player.unlockedEnemies.length)]](player.level);
			enemyLevel = randomEnemy.level;
		}
		generateItems(randomEnemy, modifier);
		enemyList.push(randomEnemy);
		remaining -= randomEnemy.level;
	}
	enemyList = shuffle(enemyList);
	return enemyList;
}

function shuffle(array) {
	for (let i = array.length - 1; i > 0; i--) {
		const j = Math.floor(Math.random() * (i + 1));
		[array[i], array[j]] = [array[j], array[i]];
	}
	return array;
}

async function combat(enemies, levelType) {
	clearBoard();
	boss3Move1Count = 1;
	coreLoop: while (true) {
		document.getElementById('activePlayer').classList.add('currentTurn');
		await playerUpkeep(enemies);
		await update(enemies);
		if (endGame(enemies)) {
			break coreLoop;
		}
		if (player.status["Stunned"] == 0) {
		let moveCompleted = false;
			while (moveCompleted == false) {
				renderPlayer(true, true);
				renderEnemies(enemies, false);
				let action = await getInput(".playerMove");
				let target;
				if ([baseMove, spell1, spell3].includes(action)) {
					renderPlayer(true, false);
					document.getElementById('button' + action).textContent = "Undo";
					document.getElementById('button' + action).disabled = false;
					document.getElementById('button' + action).classList.add('enemySelect');
					renderEnemies(enemies, true);
					let enemyIndex = await getInput(".enemySelect");
					if (/^-?\d+$/.test(enemyIndex) == false) {
						continue;
					} else {
						target = enemies[enemyIndex];
					}
				} else if ([item1, item2, item3, item4, item5, spell5].includes(action)) {
					target = player;
				} else {
					target = enemies;
				}
				await performAction(player, action, target, enemies, levelType);
				moveCompleted = true;
			}
		} else {
			await log(`${player.name} was stunned and couldn't move.`, enemies);
		}
		await update(enemies);
		if (endGame(enemies)) {
			break coreLoop;
		}
		document.getElementById('activePlayer').classList.remove('currentTurn');
		let cap = enemies.length;
		for (let i = 0; i < cap; i++) {
			document.getElementById('activeEnemy').children[i].classList.add('currentTurn');
			let current = enemies[i];
			await enemyUpkeep(enemies[i], enemies);
			let returned = await update(enemies, i);
			let removed = returned[0];
			i = returned[1];
			cap -= removed;
			if (endGame(enemies)) {
				break coreLoop;
			}
			if ((i >= 0) && (enemies[i] === current)) {
				if (enemies[i].status["Stunned"] == 0) {
					let enemyAction = pickMove(enemies[i], enemies);
					let enemyTarget;
					if ([item1, item3, item4, item5, rockMove, boss3Move1, evolveMove].includes(enemyAction)) {
						enemyTarget = enemies[i];
					} else if ([doctorMove, boss1Move1, boss1Move2, makerMove, boss2Move1, supportMove1, supportMove2, supportMove3].includes(enemyAction)) {
						enemyTarget = enemies;
					} else {
						enemyTarget = player;
					}
					let added = await performAction(enemies[i], enemyAction, enemyTarget, enemies, levelType) ?? 0;
					cap += added;
				} else {
					await log(`${enemies[i].name} was stunned and couldn't move.`, enemies);
				}
				let returned = await update(enemies, i);
				let removed = returned[0];
				i = returned[1];
				cap -= removed;
				if (endGame(enemies)) {
					break coreLoop;
				}
				if ((i >= 0) && (document.getElementById('activeEnemy').children[i].classList.contains('currentTurn'))) {
					document.getElementById('activeEnemy').children[i].classList.remove('currentTurn');
				}
			}
		}
	}
	document.getElementById('activePlayer').classList.remove('currentTurn');
	for (let i = 0; i < enemies.length; i++) {
		document.getElementById('activeEnemy').children[i].classList.remove('currentTurn');
	}
	update(enemies);
	renderEnemies(enemies, false);
	renderPlayer(true, false);
	if (player.currentHealth <= 0) {
		await log(`${player.name} fainted!`, enemies);
		await new Promise(resolve => setTimeout(resolve, 1000));
		loseGame();
	} else if (enemies.length == 0) {
		let bonusExp = 0;
		if (levelType == "easy") {
			bonusExp = player.level*1;
		} else if (levelType == "medium") {
			bonusExp = player.level*3;
		} else if (levelType == "hard") {
			bonusExp = player.level*5;
		} else if (["boss1", "boss2", "boss3", "boss4", "boss5"].includes(levelType)) {
			bonusExp = player.level*10;
		}
		if (player.level < 100) {
			player.exp += bonusExp;
		} else {
			player.exp = Math.min((player.exp + bonusExp), 10000);
		}
		await log(`${player.name} gained ${bonusExp} bonus EXP.`, enemies);
		while ((player.exp >= player.level*100) && (player.level < 100)) {
			await levelUp(enemies);
		}
		await new Promise(resolve => setTimeout(resolve, 1000));
		if (levelType == "boss1") {
			earnAchievement("Medal of Courage");
		}
		if (levelType == "boss2") {
			earnAchievement("Medal of Endurance");
		}
		if (levelType == "boss3") {
			earnAchievement("Medal of Strength");
		}
		if (levelType == "boss4") {
			earnAchievement("Medal of Honor");
		}
		if (levelType == "boss5") {
			earnAchievement("Medal of Peace");
		}
		player.currentHealth = player.health;
		player.currentMana = player.mana;
		player.status["Burned"] = 0;
		player.status["Buffed"] = [];
		player.status["Reflecting"] = false;
		player.status["Stunned"] = 0;
		player.status["Immune"] = 0;
		player.status["Supercharged"] = 1;
		save(slot);
		winGame();
	}
}

function getInput(type) {
	return new Promise((resolve) => {
		document.addEventListener('click', (event) => {
			if (event.target.matches(type)) {
				const input = event.target.dataset.user;
				resolve(input);
			}
		});
	});
}

function endGame(enemies) {
	if (player.currentHealth <= 0 || enemies.length == 0) {
		return true;
	} else {
		return false;
	}
}

async function update(enemies, i = 0) {
	let removed = 0;
	for (let o = 0; o < enemies.length; o++) {
		if (enemies[o].currentHealth == 0) {
			killSubordinates(enemies[o]);
		}
	}
	let jCap = enemies.length;
	for (let j = 0; j < jCap; j++) {
		if (enemies[j].currentHealth <= 0) {
			document.getElementById('activeEnemy').children[j].classList.remove('currentTurn');
			if ((enemies[j].name == enemy53) && (enemies[j].level > 1)) {
				let originalName = enemies[j].name;
				let baby1 = enemyLibrary[enemy53](player.level);
				let baby2 = enemyLibrary[enemy53](player.level);
				baby1.level = enemies[j].level - 1;
				baby2.level = enemies[j].level - 1;
				baby1.health = Math.round(enemies[j].health/2);
				baby1.currentHealth = baby1.health;
				baby2.health = Math.round(enemies[j].health/2);
				baby2.currentHealth = baby2.health;
				baby1.damage = Math.floor(enemies[j].damage/2);
				baby2.damage = Math.floor(enemies[j].damage/2);
				let flipflop = (Math.random() < 0.5);
				baby1.items = {};
				baby2.items = {};
				for (item in enemies[j].items) {
					baby1.items[item] = {...itemLibrary[item]};
					baby2.items[item] = {...itemLibrary[item]};
					while (enemies[j].items[item].quantity > 0) {
						if (flipflop == false) {
							baby1.items[item].quantity += 1;
						} else if (flipflop == true) {
							baby2.items[item].quantity += 1;
						}
						flipflop = !flipflop;
						enemies[j].items[item].quantity -= 1;
					}
				}
				baby1.status["Burned"] = enemies[j].status["Burned"];
				baby2.status["Burned"] = enemies[j].status["Burned"];
				baby1.status["Buffed"] = [...enemies[j].status["Buffed"]];
				baby2.status["Buffed"] = [...enemies[j].status["Buffed"]];
				baby1.status["Reflecting"] = enemies[j].status["Reflecting"];
				baby2.status["Reflecting"] = enemies[j].status["Reflecting"];
				baby1.status["Stunned"] = enemies[j].status["Stunned"];
				baby2.status["Stunned"] = enemies[j].status["Stunned"];
				baby1.status["Immune"] = enemies[j].status["Immune"];
				baby2.status["Immune"] = enemies[j].status["Immune"];
				enemies.splice(j, 1, baby1, baby2);
				removed -= 1;
				if (j <= i) {
					i += 1;
				}
				jCap += 1;
				j += 1;
				await log(`${originalName} split!`, enemies);
			} else {
				let deleted = enemies[j].name;
				let expGained = Math.max((enemies[j].level * 5) + (Math.floor(Math.random() * 9) - 4), 1);
				let itemsDropped = [];
				for (item in enemies[j].items) {
					if ((player.items[item]) && (Math.random() < ((player.items[item].quantity > 0) ? (1 / (1 + (Math.pow(player.items[item].quantity, 0.5)))) : (0.5)))) {
						itemsDropped.push(item);
					}
				}
				if ((player.items[item2]) && (deleted != enemy21) && (Math.random() < ((player.items[item2].quantity > 1) ? (1 / (1 + (Math.pow(player.items[item2].quantity, 0.6)))) : (0.4)))) {
					if (itemsDropped.includes(item1)) {
						itemsDropped.splice(1, 0, item2);
					} else {
						itemsDropped.splice(0, 0, item2);
					}
				}
				if (player.level < 100) {
					player.exp += expGained;
				} else {
					player.exp = Math.min((player.exp + expGained), 10000);
				}
				enemies.splice(j, 1);
				if (j <= i) {
					i -= 1;
				}
				jCap -= 1;
				j -= 1;
				removed += 1;
				await log(`${deleted} fainted.`, enemies);
				for (let m = itemsDropped.length - 1; m >= 0; m--) {
					if (player.items[itemsDropped[m]]) {
						player.items[itemsDropped[m]].quantity = Math.min((player.items[itemsDropped[m]].quantity + 1), 99);
					} else {
						itemsDropped.splice(m, 1);
					}
				}
				if (itemsDropped.length == 0) {
					await log(`${player.name} gained ${expGained} EXP.`, enemies);
				} else if (itemsDropped.length == 1) {
					await log(`${player.name} obtained a ${itemsDropped[0]} and gained ${expGained} EXP.`, enemies);
				} else {
					let string = "";
					for (item of itemsDropped) {
						string += "a " + item.toString() + ", ";
					}
					await log(`${player.name} obtained ${string}and gained ${expGained} EXP.`, enemies);
				}
				while ((player.exp >= player.level*100) && (player.level < 100)) {
					await levelUp(enemies);
				}
			}
		}
	}
	return [removed, i];
}

async function playerUpkeep(enemies) {
	if (player.status["Buffed"].length > 0) {
		for (let j = player.status["Buffed"].length - 1; j >= 0; j--) {
			player.status["Buffed"][j] -= 1;
		}
		for (let j = player.status["Buffed"].length - 1; j >= 0; j--) {
			if (player.status["Buffed"][j] == 0) {
				player.status["Buffed"].splice(j, 1);
			}
		}
	}
	if (player.status["Reflecting"] == true) {
		player.status["Reflecting"] = false;
	}
	if (player.status["Immune"] > 0) {
		player.status["Immune"] -= 1
	}
	if (player.status["Burned"] > 0) {
		if (Math.random() <= (1 / (2 + (Math.pow(player.status["Burned"], 1/5))))) {
			player.status["Burned"] = 0;
			await log(`${player.name} recovered from being burned.`, enemies);
		} else {
			player.currentHealth = Math.max((player.currentHealth - 5), 0);
			await log(`${player.name} took 5 damage from being burned.`, enemies);
		}
	}
	if (player.status["Stunned"] > 0) {
		if (Math.random() <= (1 / (1 + (Math.pow(player.status["Stunned"], 1/5))))) {
			player.status["Stunned"] = 0;
			await log(`${player.name} recovered from being stunned.`, enemies);
		}
	}
}

		for (let j = enemy.status["Buffed"].length - 1; j >= 0; j--) {
			enemy.status["Buffed"][j] -= 1;
		}
		for (let j = enemy.status["Buffed"].length - 1; j >= 0; j--) {
			if (enemy.status["Buffed"][j] == 0) {
				enemy.status["Buffed"].splice(j, 1);
			}
		}
	}
	if ((enemy.status["Reflecting"] == true) && !([boss4].includes(enemy.name))) {
		enemy.status["Reflecting"] = false;
	}
	if (enemy.status["Immune"] > 0) {
		enemy.status["Immune"] -= 1;
	}
	if (enemy.status["Burned"] > 0) {
		if (Math.random() <= (1 / (2 + (Math.pow(enemy.status["Burned"], 1/5))))) {
			enemy.status["Burned"] = 0;
			await log(`${enemy.name} recovered from being burned.`, enemies);
		} else {
			enemy.currentHealth = Math.max((enemy.currentHealth - 5), 0);
			await log(`${enemy.name} took 5 damage from being burned.`, enemies);
		}
	}
	if (enemy.status["Stunned"] > 0) {
		if ((Math.random() <= (1 / (1 + (Math.pow(enemy.status["Stunned"], 1/5))))) || ((enemy.name == boss4) && (enemy.currentHealth <= (enemy.health/4)))) {
			enemy.status["Stunned"] = 0;
			await log(`${enemy.name} recovered from being stunned.`, enemies);
		}
	}

				actor.status["Stunned"] = Math.max(actor.status["Stunned"], wasReflected);
			}
			await log(`${action} was reflected back to ${actor.name}.`, enemies);
		}
	} else if (action == firestormMove) {
		let oneFourth = Math.floor(Math.random()*4);
		if (oneFourth == 0) {
			await log(`${actor.name} used ${action} on ${target.name}, but it failed!`, enemies);
		} else if (oneFourth == 1) {
			let wasReflected = 0;
			if ((target.status["Reflecting"] == true) && (Math.random() < 0.5)) {
				wasReflected = 1;
			} else {
				if (target.status["Immune"] == 0) {
					target.status["Burned"] = Math.max(target.status["Burned"], 1);
				}
			}
			await log(`${actor.name} burned ${target.name} using ${action}.`, enemies);
			if (wasReflected > 0) {
				if (actor.status["Immune"] == 0) {
					actor.status["Burned"] = Math.max(wasReflected, actor.status["Burned"]);
				}
				await log(`${action}’s burn was reflected back to ${actor.name}.`, enemies);
			}
		} else if (oneFourth == 2) {
			let wasReflected = 0;
			if ((target.status["Reflecting"] == true) && (Math.random() < 0.5)) {
				wasReflected = 1;
			} else {
				if (target.status["Immune"] == 0) {
					target.status["Stunned"] = Math.max(target.status["Stunned"], 1);
				}
			}
			await log(`${actor.name} Stunned ${target.name} using ${action}.`, enemies);
			if (wasReflected > 0) {
				if (actor.status["Immune"] == 0) {
					actor.status["Stunned"] = Math.max(wasReflected, actor.status["Stunned"]);
				}
				await log(`${action}’s stun was reflected back to ${actor.name}.`, enemies);
			}
		} else if (oneFourth == 3) {
			let wasReflected = 0;
			if ((target.status["Reflecting"] == true) && (Math.random() < 0.5)) {
				wasReflected = 1;
			} else {
				if (target.status["Immune"] == 0) {
					target.status["Burned"] = Math.max(target.status["Burned"], 1);
					target.status["Stunned"] = Math.max(target.status["Stunned"], 1);
				}
			}
			await log(`${actor.name} burned and stunned ${target.name} using ${action}.`, enemies);
			if (wasReflected > 0) {
				if (actor.status["Immune"] == 0) {
					actor.status["Burned"] = Math.max(wasReflected, actor.status["Burned"]);
					actor.status["Stunned"] = Math.max(wasReflected, actor.status["Stunned"]);
				}
				await log(`${action}’s burn and stun was reflected back to ${actor.name}.`, enemies);
			}
		}
	} else if (action == supportMove1) {
		if (Array.isArray(target)) {
			for (let p = 0; p < target.length; p++) {
				if ((target[p].status["Buffed"].length < 3) && (!(target[p] === actor))) {
					target[p].status["Buffed"].push(4);
				}
			}
		}
		await log(`${actor.name} used ${action} on all enemies.`, enemies);
	} else if (action == supportMove2) {
		if (Array.isArray(target)) {
			for (let p = 0; p < target.length; p++) {
				if (!(target[p] === actor)) {
					target[p].status["Reflecting"] = true;
				}
			}
		}
		await log(`${actor.name} used ${action} on all enemies.`, enemies)
	} else if (action == supportMove3) {
		if (Array.isArray(target)) {
			for (let p = 0; p < target.length; p++) {
				if (!(target[p] === actor)) {
					target[p].status["Immune"] += 2;
					target[p].status["Burned"] = 0;
					target[p].status["Stunned"] = 0;
				}
			}
		}
		await log(`${actor.name} used ${action} on all enemies.`, enemies)
	} else if (action == boss4Move3) {
		target.status["Burned"] = Math.max(actor.status["Burned"], target.status["Burned"]);
		actor.status["Burned"] = 0;
		target.status["Stunned"] = Math.max(actor.status["Stunned"], target.status["Stunned"]);
		actor.status["Stunned"] = 0;
		for (let p = 0; p < target.status["Buffed"].length; p++) {
			actor.status["Buffed"].push(target.status["Buffed"][p]);
		}
		for (let p = target.status["Buffed"].length - 1; p >= 0; p--) {
			target.status["Buffed"].splice(p, 1);
		}
		if (target.status["Reflecting"] == true) {
			actor.status["Reflecting"] = target.status["Reflecting"];
			target.status["Reflecting"] = false;
		}
		actor.status["Immune"] += target.status["Immune"];
		target.status["Immune"] = 0;
		await log(`${actor.name} used ${action} on ${target.name}.`, enemies);
	} else if (action == evolveMove) {
		let newCreature = enemyLibrary[enemyNames[Math.floor(Math.random() * enemyNames.length)]](player.level);
		let oldName = actor.name;
		actor.name = newCreature.name;
		actor.level = newCreature.level;
		actor.health = newCreature.health;
		actor.currentHealth = newCreature.health;
		actor.damage = newCreature.damage;
		let copiedItems = actor.items;
		actor.items = {};
		for (item in itemLibrary) {
			if (((copiedItems[item]) && (copiedItems[item].quantity > 0)) || ((newCreature.items[item]) && (newCreature.items[item].quantity > 0))) {
				actor.items[item] = {...itemLibrary[item]};
				actor.items[item].quantity = Math.min((((copiedItems[item]) ? (copiedItems[item].quantity) : (0)) + ((newCreature.items[item]) ? (newCreature.items[item].quantity) : (0))), 99);
			}
		}
		await log(`${oldName} evolved into ${actor.name}!`, enemies)
	}
}

function killSubordinates(manager) {
	if (manager.subordinates) {
		for (let u = 0; u < manager.subordinates.length; u++) {
			manager.subordinates[u].currentHealth = 0;
			killSubordinates(manager.subordinates[u]);
		}
	}
}

function earnAchievement(achievementName) {
	if ((achievementLibrary[achievementName]) && !(player.achievements[achievementName])) {
		player.achievements[achievementName] = {...achievementLibrary[achievementName]};
		let notif = document.createElement('div');
		notif.classList.add('notification');
		notif.textContent = `Achievement Earned: ${achievementName}`;
		document.getElementById('achievementNotifications').appendChild(notif);
		setTimeout(() => {
			document.getElementById('achievementNotifications').querySelectorAll('div').forEach((div) => {
				if (div.textContent == `Achievement Earned: ${achievementName}`) {
					div.classList.add('invisible');
				}
			});
			setTimeout(() => {
				document.getElementById('achievementNotifications').querySelectorAll('div').forEach((div) => {
					if (div.textContent == `Achievement Earned: ${achievementName}`) {
						div.remove();
					}
				});
			}, 2000);
		}, 3000);
	}
}

function start() {
	let playerName = document.getElementById('playerName').value;
	if (playerName.length >= 1 && playerName.length <= 20) {
		player = new Character(playerName, 1, 0, 10, 1, 5, {}, [], [], [enemy11, enemy12, enemy13]);
		renderMenu();
	} else {
		document.getElementById('nameError').innerHTML = "Please enter a name between 1-20 characters";
	}
}
